<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tobias Levin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #0B0B0B;
            height: 100%;
        }

        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 13px;
            height: 13px;
            pointer-events: none;
            z-index: 1;
        }

        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }

        .crosshair::before {
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            transform: translateX(-50%);
        }

        .crosshair::after {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            transform: translateY(-50%);
        }

        .photos {
            width: min(90vw, 700px);
            margin: 0 auto;
            padding: 18vh 0;
        }

        .photos img {
            display: block;
            width: 100%;
            height: auto;
            margin-bottom: 14vh;
        }

        .photos img:last-child { margin-bottom: 0; }

        @media (max-width: 600px) {
            .photos { width: 100%; }
        }

        .email {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            font-size: 12px;
            color: #666;
            text-decoration: none;
        }

        .email:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="crosshair"></div>

    <a class="email" href="mailto:tobiaslvn@gmail.com">tobiaslvn@gmail.com</a>
